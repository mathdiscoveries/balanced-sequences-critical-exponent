status:
  scope: >-
    Unconditionally proved in Lean 4 (v4.35.0) + Mathlib with standard axioms
    only (zero sorry, zero native_decide; 11 of 13 files in
    BalancedRepetitionThreshold import Mathlib): 26 compared theorems (193
    public declarations across the supporting library) establishing exact
    RTB(7) = RTB_strict(7) = 6/5 < 5/4, RTB(9) = RTB_strict(9) = 8/7 < 7/6, and
    RTB(10) = RTB_strict(10) = 9/8 < 8/7, universal lower bounds E(w) >= 6/5,
    8/7, 9/8 for every 1-balanced sequence over Fin 7, Fin 9, Fin 10 via
    exhaustive kernel-checked witness trees (905, 2941, and 4868 nodes), direct
    1-balance, full alphabet usage, explicit attaining factors, and exact
    critical exponents of the Sturmian-colouring witnesses v7, v9, v10 (attained
    in minPeriodExponentSet), plus equivalence of the minimal-period and
    any-period critical exponent definitions. Companion paper coverage: 6 of 6
    main results in Lean 4 (100%) · 12 of 12 abstract claims in Lean 4 (100%) ·
    18 of 18 paper claims in Lean 4 (100%) · 0 by external certificate · 0 by
    written proof. The cases d = 5, 6, 8, and d >= 11 are not addressed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

